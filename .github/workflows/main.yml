name: RDP v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub hard limit for hosted runners

    steps:
      - name: Setup RDP + User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Enable RDP (NLA + TLS on)
          $ts  = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty $ts  -Name fDenyTSConnections -Value 0
          Set-ItemProperty $tcp -Name UserAuthentication -Value 1
          Set-ItemProperty $tcp -Name SecurityLayer -Value 2

          # Firewall: only Tailscale addresses can reach RDP
          Get-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow `
            -Protocol TCP -LocalPort 3389 -RemoteAddress "100.64.0.0/10" -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force

          # Never sleep / lock / turn off display
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /hibernate off

          # Strong random password (20 chars, all character classes)
          $sets = @("ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnopqrstuvwxyz", "23456789", "!@#%^*-_=+")
          $chars = foreach ($s in $sets) { 1..4 | ForEach-Object { $s[(Get-Random -Maximum $s.Length)] } }
          $all = ($sets -join "")
          $chars += 1..4 | ForEach-Object { $all[(Get-Random -Maximum $all.Length)] }
          $password = -join ($chars | Sort-Object { Get-Random })
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $secure -PasswordNeverExpires $true
          } else {
            New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "RDP and user ready."

      - name: Install & Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { throw "TAILSCALE_AUTH_KEY secret is missing." }

          $msi = "$env:TEMP\tailscale.msi"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi -MaximumRetryCount 3 -RetryIntervalSec 3
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          Remove-Item $msi -Force
          if ($p.ExitCode -notin 0, 3010) { throw "Tailscale install failed ($($p.ExitCode))." }

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $exe up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=gh-runner-$env:GITHUB_RUN_ID" --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed." }

          $ip = $null
          for ($i = 0; $i -lt 30 -and -not $ip; $i++) {
            $r = & $exe ip -4
            if ($LASTEXITCODE -eq 0 -and $r) { $ip = ($r | Select-Object -First 1).Trim() } else { Start-Sleep 2 }
          }
          if (-not $ip) { throw "Could not obtain Tailscale IP." }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          if (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            throw "RDP listener is unavailable."
          }
          Write-Host "Tailscale connected: $ip"

      - name: Session (Connection Info)
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================"
          Write-Host "         RDP ACCESS"
          Write-Host "================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "User    : RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "================================"
          Write-Host ""

          # Run until just before the 6h limit, then exit cleanly
          $end = (Get-Date).AddMinutes(355)
          while ((Get-Date) -lt $end) {
            if ((Get-Service TermService).Status -ne "Running") {
              Write-Host "Restarting RDP service..."
              Start-Service TermService
            }
            $left = [int]($end - (Get-Date)).TotalMinutes
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP active - $left min left - $env:TAILSCALE_IP"
            Start-Sleep -Seconds 60
          }
          Write-Host "Session limit reached. Re-run the workflow for a new session."
          
