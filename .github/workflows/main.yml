name: RDP v2

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the session up (max ~350)"
        default: "350"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub hard cap for hosted runners

    steps:
      # Tailscale first, via the official action (faster, cached, no manual MSI)
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-rdp-${{ github.run_id }}

      - name: Configure RDP + No Sleep
        shell: pwsh
        run: |
          # Enable RDP, keep NLA ON (safer, still works fine over Tailscale)
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty $ts -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty "$ts\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1 -Force

          # Only allow RDP from the Tailscale range, not the whole internet
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow `
            protocol=TCP localport=3389 remoteip=100.64.0.0/10 | Out-Null

          # No sleep / no screen-off / no lock
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /hibernate off
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization' `
            -Name NoLockScreen -Value 1 -Force -ErrorAction SilentlyContinue

          Restart-Service TermService -Force

      - name: Create RDP user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 12) {
            Write-Error "Add a repo secret RDP_PASSWORD (12+ chars). Passwords printed in logs are visible on public repos."
            exit 1
          }
          Write-Output "::add-mask::$env:RDP_PASSWORD"
          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $sec -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            $ip = (& tailscale ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 2 }
          }
          if (-not $ip) { Write-Error "No Tailscale IP"; exit 1 }
          "TS_IP=$ip" >> $env:GITHUB_ENV

      - name: Keep session alive
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          $mins = [Math]::Min([int]$env:MINUTES, 350)
          $end  = (Get-Date).AddMinutes($mins)

          Write-Host "`n=== RDP READY ==="
          Write-Host "Address : $env:TS_IP"
          Write-Host "User    : RDP"
          Write-Host "Pass    : (your RDP_PASSWORD secret)"
          Write-Host "Ends at : $end"
          Write-Host "=================`n"

          while ((Get-Date) -lt $end) {
            if ((Get-Service TermService).Status -ne 'Running') { Start-Service TermService }
            $left = [int]($end - (Get-Date)).TotalMinutes
            Write-Host "[$(Get-Date -Format T)] RDP active, $left min left"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $ts) { & $ts logout }
          exit 0
